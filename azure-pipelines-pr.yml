trigger: none

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
    displayName: Install Node 22

  - script: npm ci
    displayName: Install dependencies

  - script: npm run build
    displayName: Build client

  - script: npm audit --omit=dev --audit-level=high
    displayName: Dependency audit
    continueOnError: true

  - script: docker build -t portfolio-app:pr .
    displayName: Validate Docker build