<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aboubaker Tounli · Cloud &amp; DevOps</title>
  <meta name="description" content="Aboubaker Tounli, Cloud and DevOps engineer in Rabat. Graduation internship and the role after it. Cloud platforms, Kubernetes, CI/CD, and FinOps.">
  <meta name="theme-color" content="#0e0d0b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316130f'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23e8a54b'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    try {
      var saved = localStorage.getItem("portfolio-lang");
      if (saved === "fr" || (!saved && navigator.language.toLowerCase().indexOf("fr") === 0)) {
        document.documentElement.lang = "fr";
      }
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" id="skip" href="#cmd">Skip to the console</a>
  <div class="ambient" aria-hidden="true"></div>
  <main class="shell">
    <header class="top">
      <div class="identity">
        <button class="portrait-btn" id="portrait-btn" type="button">
          <img class="portrait" src="photo.jpg" width="104" height="128" alt="Portrait of Aboubaker Tounli">
        </button>
        <div class="identity-copy">
          <p class="eyebrow" id="role"></p>
          <h1>Aboubaker Tounli</h1>
          <p class="status"><span class="dot" aria-hidden="true"></span><span id="status"></span></p>
          <p class="quick-links">
            <a href="mailto:aboubakertounli@gmail.com">Email</a>
            <a href="https://www.linkedin.com/in/aboubaker-tounli/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="https://github.com/aboubakertounli" target="_blank" rel="noopener noreferrer">GitHub</a>
          </p>
        </div>
      </div>
      <div class="top-actions">
        <div class="lang" role="group" id="lang-group" aria-label="Language">
          <button type="button" data-lang="en" aria-pressed="true">EN</button>
          <button type="button" data-lang="fr" aria-pressed="false">FR</button>
        </div>
        <p class="clock"><span id="place"></span><time id="clock"></time></p>
      </div>
    </header>

    <div class="layout">
      <nav class="rail" aria-labelledby="rail-label">
        <p class="rail-label" id="rail-label"></p>
        <div id="rail"></div>
      </nav>

      <section class="console" aria-labelledby="console-title">
        <div class="console-bar">
          <span class="led" aria-hidden="true"></span>
          <h2 id="console-title"></h2>
        </div>
        <div class="screen" id="screen" role="log" aria-live="polite" aria-relevant="additions"></div>
        <form class="prompt-row" id="form">
          <label id="prompt-label" for="cmd">aboubaker@portfolio:~$</label>
          <input id="cmd" name="command" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
        </form>
        <p class="hint" id="hint"></p>
      </section>
    </div>
  </main>
  <noscript>
    <p>Aboubaker Tounli. Cloud and DevOps engineer in Rabat. I like systems that stay up, stay understandable, and cost less than they did last month.</p>
  </noscript>
  <script src="app.js"></script>
</body>
</html>
